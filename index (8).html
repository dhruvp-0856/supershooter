<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SlingShockFPS - v9.6.4</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    
    /* Crosshair & Hitmarker */
    #crosshair-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
    #crosshair { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.8); }
    
    #hitmarker {
      position: absolute; top: 50%; left: 50%; width: 24px; height: 24px;
      transform: translate(-50%, -50%) scale(0.5); opacity: 0; pointer-events: none; transition: transform 0.05s ease-out, opacity 0.15s ease-out;
    }
    #hitmarker::before, #hitmarker::after {
      content: ''; position: absolute; background: white; top: 50%; left: 50%;
    }
    #hitmarker::before { width: 100%; height: 2px; transform: translate(-50%, -50%) rotate(45deg); }
    #hitmarker::after { width: 100%; height: 2px; transform: translate(-50%, -50%) rotate(-45deg); }

    #hitmarker.hit { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
    #hitmarker.hit::before, #hitmarker.hit::after { background: #ffffff; }

    #hitmarker.headshot { opacity: 1; transform: translate(-50%, -50%) scale(1.6); }
    #hitmarker.headshot::before, #hitmarker.headshot::after { background: #ff3344; box-shadow: 0 0 8px #ff3344; }

    #sniper-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; display: none; z-index: 4; }
    #sniper-overlay::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80vh; height: 80vh; border-radius: 50%; box-shadow: 0 0 0 9999px black; border: 2px solid #222; }
    /* Full reticle: horizontal + vertical crosshair lines with a center gap, plus a center dot */
    #scope-reticle { position: absolute; top: 50%; left: 50%; width: 80vh; height: 80vh; transform: translate(-50%, -50%); }
    #scope-reticle .h-line, #scope-reticle .v-line { position: absolute; background: rgba(51, 136, 255, 0.65); }
    #scope-reticle .h-line { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
    #scope-reticle .v-line { left: 50%; top: 0; height: 100%; width: 1px; transform: translateX(-50%); }
    #scope-reticle .gap { position: absolute; top: 50%; left: 50%; width: 34px; height: 34px; transform: translate(-50%, -50%); background: black; border-radius: 50%; }
    #scope-reticle .dot { position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; border-radius: 50%; background: rgba(51, 136, 255, 0.9); transform: translate(-50%, -50%); }

    /* Pullout-delay ring around crosshair */
    #pullout-ring { position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%) rotate(-90deg); pointer-events: none; z-index: 5; opacity: 0; }
    #pullout-ring circle { fill: none; stroke: rgba(255, 255, 255, 0.85); stroke-width: 2; }
    #pullout-ring circle.bg { stroke: rgba(255, 255, 255, 0.15); }

    /* Floating Overhead Shield + Health Bars */
    #target-hp-container {
      position: absolute; width: 60px; height: 12px; 
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease-out; z-index: 3;
      transform: translate(-50%, -100%); display: flex; flex-direction: column; gap: 2px;
    }
    #target-shield-container, #target-hp-bg {
      width: 100%; height: 5px; background: rgba(15, 15, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 2px; overflow: hidden;
    }
    #target-shield-fill { width: 100%; height: 100%; background: #8e9eab; transition: width 0.15s ease-out; }
    #target-hp-fill { width: 100%; height: 100%; background: #ff4655; transition: width 0.15s ease-out; }

    /* Transparent Modern Weapon HUD (Bottom Left) */
    #hud-container { position: absolute; bottom: 30px; left: 40px; display: flex; flex-direction: column; align-items: flex-start; color: #fff; pointer-events: none; z-index: 2; font-weight: 700; }

    
    .hud-weapon-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    
    @keyframes slideForward { 0% { transform: translateX(35px); opacity: 0.2; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideBackward { 0% { transform: translateX(-35px); opacity: 0.2; } 100% { transform: translateX(0); opacity: 1; } }
    .hud-weapon-row.slide-forward { animation: slideForward 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .hud-weapon-row.slide-backward { animation: slideBackward 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }

    .arrow-btn { font-size: 18px; color: rgba(255, 255, 255, 0.4); font-family: monospace; text-shadow: 0 0 6px rgba(0,0,0,0.8); }
    .weapon-icon-box { width: 140px; height: 45px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0px 2px 8px rgba(0,0,0,0.8)); }
    .weapon-icon-box svg { width: 100%; height: 100%; fill: #3388ff; transition: fill 0.2s, transform 0.2s; }
    .hud-info { display: flex; flex-direction: column; align-items: flex-start; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    
    #weapon-recoil-display { font-size: 11px; letter-spacing: 1.5px; color: #cc88ff; text-transform: uppercase; margin-bottom: 1px; }
    #weapon-firerate-display { font-size: 11px; letter-spacing: 1.5px; color: #ffcc00; text-transform: uppercase; margin-bottom: 1px; }
    #weapon-dmg-display { font-size: 11px; letter-spacing: 1.5px; color: #ff4655; text-transform: uppercase; margin-bottom: 1px; }
    #weapon-headshot-display { font-size: 9px; letter-spacing: 1.2px; color: rgba(255, 70, 85, 0.6); text-transform: uppercase; margin-bottom: 1px; }
    #weapon-speed-display { font-size: 11px; letter-spacing: 1.5px; color: #4af; text-transform: uppercase; margin-bottom: 2px; }
    #weapon-name-display { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); }
    .ammo-box { display: flex; align-items: baseline; gap: 6px; line-height: 1; margin-top: 2px; }
    #ammo-current { font-size: 42px; color: #fff; }
    .ammo-divider { font-size: 22px; color: rgba(255, 255, 255, 0.3); }
    #ammo-max { font-size: 22px; color: rgba(255, 255, 255, 0.6); }

    /* Magazine icon next to ammo counter */
    .mag-icon-box { position: relative; width: 26px; height: 34px; margin-left: 4px; opacity: 0.9; }
    .mag-icon-box svg.mag-body { width: 100%; height: 100%; }
    .mag-icon-box .mag-reserve-count {
      position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .mag-icon-box .mag-reload-badge {
      position: absolute; top: -5px; right: -5px; width: 13px; height: 13px;
      background: rgba(15, 15, 20, 0.85); border-radius: 50%; padding: 1px;
    }
    .mag-icon-box.hidden { display: none; }

    /* Player Health & Shield HUD + Stamina Bar (Bottom Middle) */
    #player-status-container {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 8px; width: 480px;
      pointer-events: none; z-index: 2; font-family: sans-serif;
    }
    
    #stamina-container {
      width: 100%; height: 6px; background: rgba(15, 15, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 3px;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease-out; backdrop-filter: blur(4px);
    }
    #stamina-fill { width: 100%; height: 100%; background: #4af; border-radius: 2px; transition: width 0.05s linear; box-shadow: 0 0 6px rgba(68, 170, 255, 0.6); }

    .status-row { display: flex; align-items: center; gap: 12px; background: rgba(10, 10, 15, 0.65); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(4px); }
    .status-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .status-bar-bg { flex-grow: 1; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; position: relative; }
    .status-bar-fill { height: 100%; width: 100%; border-radius: 3px; transition: width 0.2s ease-out; }
    #health-fill { background: #ff4655; box-shadow: 0 0 8px rgba(255, 70, 85, 0.6); }
    #shield-fill { background: #8e9eab; box-shadow: 0 0 8px rgba(142, 158, 171, 0.6); }
    .status-val { font-size: 13px; font-weight: bold; color: #fff; min-width: 32px; text-align: right; }

    /* Menu & Overlay Styling */
    #menu-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(10, 10, 15, 0.85); color: white; z-index: 10; }
    .card { background: #1a1a24; border: 1px solid #333; border-radius: 12px; width: 550px; max-height: 85vh; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    h1 { font-size: 28px; margin: 0 0 15px 0; color: #4af; text-align: center; letter-spacing: 1px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .tab-btn { background: #2a2a36; border: none; color: #888; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: #4af; color: #fff; }
    .tab-content { display: none; overflow-y: auto; flex-grow: 1; padding-right: 5px; }
    .tab-content.active { display: block; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .setting-row label { font-size: 14px; color: #ccc; }
    .setting-row input[type="range"] { width: 50%; }
    .setting-row span { font-size: 14px; color: #4af; width: 40px; text-align: right; }
    .toggle-setting-btn { background: #2a2a36; border: 1px solid #444; color: #888; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; min-width: 110px; text-align: center; }
    .toggle-setting-btn.active { background: #4af; border-color: #4af; color: #fff; }
    .keybind-btn { background: #2a2a36; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; min-width: 80px; text-align: center; font-family: monospace; }
    .keybind-btn.listening { background: #ff4655; border-color: #ff8888; }
    .btn-primary { background: #4af; border: none; color: #fff; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 16px; }
    .btn-primary:hover { background: #389ee6; }
    .btn-secondary { background: #2a2a36; border: 1px solid #444; color: #aaa; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 13px; transition: 0.2s; }
    .btn-secondary:hover { background: #383848; color: #fff; border-color: #666; }

    /* Minimap (top left) */
    #minimap-container {
      position: absolute; top: 20px; left: 20px; width: 150px; height: 150px;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; overflow: hidden;
      background: rgba(10, 10, 14, 0.6); z-index: 2; pointer-events: none;
    }
    #minimap { width: 100%; height: 100%; display: block; }

    /* Debug / model calibration overlay (toggle with "9") */
    #debug-overlay {
      position: absolute; top: 20px; right: 20px; width: 310px; 
      background: rgba(10, 10, 14, 0.85); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px;
      padding: 10px 12px; color: #fff; font-family: monospace; font-size: 11px; line-height: 1.6;
      z-index: 10; display: none; pointer-events: none; white-space: pre-wrap;
    }
    #debug-overlay .dbg-title { color: #cc88ff; font-weight: bold; margin-bottom: 4px; }
  </style>
</head>
<body>
  <!-- Minimap -->
  <div id="minimap-container"><canvas id="minimap" width="150" height="150"></canvas></div>

  <!-- Debug / model calibration overlay -->
  <div id="debug-overlay"></div>

  <!-- Crosshair & Hitmarkers -->
  <div id="crosshair-container">
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <svg id="pullout-ring" viewBox="0 0 32 32">
      <circle class="bg" cx="16" cy="16" r="13"></circle>
      <circle id="pullout-ring-fg" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="0"></circle>
    </svg>
  </div>

  <div id="sniper-overlay">
    <div id="scope-reticle">
      <div class="h-line"></div>
      <div class="v-line"></div>
      <div class="gap"></div>
      <div class="dot"></div>
    </div>
  </div>
  
  <!-- Target Shield + HP -->
  <div id="target-hp-container">
    <div id="target-shield-container"><div id="target-shield-fill"></div></div>
    <div id="target-hp-bg"><div id="target-hp-fill"></div></div>
  </div>

  <!-- Transparent Bottom-Left Weapon HUD -->
  <div id="hud-container">
    <div id="weapon-recoil-display">RECOIL: 0.0</div>
    <div id="weapon-firerate-display">FIRE RATE: 0.0/S (350MS)</div>
    <div id="weapon-dmg-display">DAMAGE: 15.0</div>
    <div id="weapon-headshot-display">HEADSHOT: 150% DAMAGE</div>
    <div id="weapon-speed-display">MOBILITY: 100%</div>
    <div class="hud-weapon-row" id="hud-weapon-row">
      <span class="arrow-btn">&lt;</span>
      <div class="weapon-icon-box" id="weapon-icon"></div>
      <span class="arrow-btn">&gt;</span>
    </div>
    <div class="hud-info">
      <div id="weapon-name-display">COMBAT KNIFE</div>
      <div class="ammo-box">
        <span id="ammo-current">--</span>
        <span class="ammo-divider">/</span>
        <span id="ammo-max">--</span>
        <div class="mag-icon-box" id="mag-icon-box">
          <svg class="mag-body" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2 H18 L17 20 H7 Z" fill="#ccc" stroke="#888" stroke-width="1"/>
            <rect x="7" y="20" width="10" height="6" fill="#999" stroke="#777" stroke-width="1"/>
          </svg>
          <svg class="mag-reload-badge" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12a8 8 0 0 1 13.66-5.66L20 8" stroke="#4af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M20 4v4h-4" stroke="#4af" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 12a8 8 0 0 1-13.66 5.66L4 16" stroke="#4af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M4 20v-4h4" stroke="#4af" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="mag-reserve-count" id="mag-reserve-count">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Player Health & Shield HUD + Stamina Bar (Bottom Middle) -->
  <div id="player-status-container">
    <!-- Stamina Bar -->
    <div id="stamina-container"><div id="stamina-fill"></div></div>

    <!-- Health Bar -->
    <div class="status-row">
      <div class="status-icon">
        <svg viewBox="0 0 24 24" fill="#ff4655" width="18" height="18"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div class="status-bar-bg"><div id="health-fill" class="status-bar-fill"></div></div>
      <span id="health-val" class="status-val">100</span>
    </div>
    
    <!-- Shield Bar -->
    <div class="status-row">
      <div class="status-icon">
        <svg viewBox="0 0 24 24" fill="#8e9eab" width="18" height="18"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      </div>
      <div class="status-bar-bg"><div id="shield-fill" class="status-bar-fill"></div></div>
      <span id="shield-val" class="status-val">100</span>
    </div>
  </div>

  <!-- Pause / Settings Menu -->
  <div id="menu-container">
    <div class="card">
      <h1 id="menu-title">PAUSED (v9.6.4)</h1>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('settings')">Settings</button>
        <button class="tab-btn" onclick="switchTab('controls')">Controls</button>
        <button class="tab-btn" onclick="switchTab('audio')">Audio</button>
      </div>

      <div id="tab-settings" class="tab-content active">
        <div class="setting-row"><label for="sens">Sensitivity</label><input type="range" id="sens" min="0.1" max="3" step="0.1" value="1.0"><span id="sens-val">1.0</span></div>
        <div class="setting-row"><label for="scope-sens">Scope Sensitivity Multiplier</label><input type="range" id="scope-sens" min="0.1" max="2" step="0.1" value="0.5"><span id="scope-sens-val">0.5</span></div>
        <div class="setting-row"><label for="fov">Field of View (FOV)</label><input type="range" id="fov" min="60" max="110" step="1" value="75"><span id="fov-val">75</span></div>
        <div class="setting-row"><label>Toggle Sprint</label><button class="toggle-setting-btn" id="toggle-sprint-btn" onclick="toggleSetting('toggleSprint')">Disabled</button></div>
        <div class="setting-row"><label>Toggle Crouch</label><button class="toggle-setting-btn" id="toggle-crouch-btn" onclick="toggleSetting('toggleCrouch')">Disabled</button></div>
        <div class="setting-row"><label>Admin Mode (Infinite Mags)</label><button class="toggle-setting-btn" id="toggle-admin-btn" onclick="toggleSetting('adminMode')">Disabled</button></div>
        <button class="btn-secondary" onclick="resetSettings()">RESET SETTINGS</button>
      </div>

      <div id="tab-controls" class="tab-content">
        <div class="setting-row"><label>Move Forward</label><button class="keybind-btn" data-action="forward" onclick="rebind('forward', this)">KeyW</button></div>
        <div class="setting-row"><label>Move Backward</label><button class="keybind-btn" data-action="backward" onclick="rebind('backward', this)">KeyS</button></div>
        <div class="setting-row"><label>Move Left</label><button class="keybind-btn" data-action="left" onclick="rebind('left', this)">KeyA</button></div>
        <div class="setting-row"><label>Move Right</label><button class="keybind-btn" data-action="right" onclick="rebind('right', this)">KeyD</button></div>
        <div class="setting-row"><label>Sprint</label><button class="keybind-btn" data-action="sprint" onclick="rebind('sprint', this)">AltLeft</button></div>
        <div class="setting-row"><label>Crouch</label><button class="keybind-btn" data-action="crouch" onclick="rebind('crouch', this)">ShiftLeft</button></div>
        <div class="setting-row"><label>Jump</label><button class="keybind-btn" data-action="jump" onclick="rebind('jump', this)">Space</button></div>
        <div class="setting-row"><label>Reload</label><button class="keybind-btn" data-action="reload" onclick="rebind('reload', this)">KeyR</button></div>
        <div class="setting-row"><label>Next Weapon</label><button class="keybind-btn" data-action="nextWeapon" onclick="rebind('nextWeapon', this)">KeyF</button></div>
        <div class="setting-row"><label>Knife</label><button class="keybind-btn" data-action="weapon1" onclick="rebind('weapon1', this)">Digit1</button></div>
        <div class="setting-row"><label>Assault Rifle</label><button class="keybind-btn" data-action="weapon2" onclick="rebind('weapon2', this)">Digit2</button></div>
        <div class="setting-row"><label>Shotgun</label><button class="keybind-btn" data-action="weapon3" onclick="rebind('weapon3', this)">Digit3</button></div>
        <div class="setting-row"><label>Sniper</label><button class="keybind-btn" data-action="weapon4" onclick="rebind('weapon4', this)">Digit4</button></div>
        <button class="btn-secondary" onclick="resetControls()">RESET CONTROLS</button>
      </div>

      <div id="tab-audio" class="tab-content">
        <div class="setting-row"><label for="master-vol">Master Volume</label><input type="range" id="master-vol" min="0" max="100" value="80"><span id="master-val">80%</span></div>
        <button class="btn-secondary" onclick="resetAudio()">RESET AUDIO</button>
      </div>

      <button class="btn-primary" onclick="resumeGame()">RESUME GAME</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTF Loader Addon -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Rapier physics: real usage is ES-module-only (no classic global-script build
       exists), so this tiny module bridges it onto window.RAPIER for the main
       classic game script below to use. RAPIER.init() (WASM) still needs to be
       awaited separately -- that happens in initPhysics() further down. -->
  <script type="module">
    import RAPIER from 'https://cdn.skypack.dev/@dimforge/rapier3d-compat@0.19.3';
    window.RAPIER = RAPIER;
    window.dispatchEvent(new Event('rapier-module-ready'));
  </script>

  <script>
    // --- Vector SVG Silhouettes for Weapons ---
    const weaponSVGs = {
      knife: `<svg viewBox="0 0 120 40"><path d="M15,22 L45,22 L55,16 L105,16 L112,20 L65,24 L45,24 L35,28 L15,28 Z"/></svg>`,
      ar: `<svg viewBox="0 0 120 40"><path d="M5,22 L25,22 L30,12 L55,12 L60,18 L95,18 L112,21 L112,25 L75,25 L65,34 L52,34 L58,25 L30,25 L22,34 L12,34 L16,22 Z"/></svg>`,
      shotgun: `<svg viewBox="0 0 120 40"><path d="M10,24 L35,24 L38,16 L65,16 L65,20 L115,20 L115,24 L70,24 L68,28 L35,28 L28,34 L18,34 L20,24 Z"/></svg>`,
      sniper: `<svg viewBox="0 0 120 40"><path d="M2,24 L20,24 L25,18 L45,18 L48,22 L70,22 L72,14 L85,14 L87,22 L118,22 L118,24 L70,24 L60,35 L48,35 L54,24 L25,24 L18,34 L8,34 Z"/></svg>`
    };

    // --- Web Audio Synthesizer Engine ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playGunshotSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = (audioSettings.master / 100);

      if (type === 'knife') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
        gain.gain.setValueAtTime(0.3 * vol, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.12);
        return;
      }

      const bufferSize = audioCtx.sampleRate * 0.18;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = type === 'sniper' ? 'lowpass' : (type === 'shotgun' ? 'bandpass' : 'lowpass');
      filter.frequency.setValueAtTime(type === 'sniper' ? 1400 : (type === 'shotgun' ? 900 : 1100), now);
      filter.frequency.exponentialRampToValueAtTime(80, now + 0.15);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.7 * vol, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(now);

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(type === 'sniper' ? 160 : 120, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
      oscGain.gain.setValueAtTime(0.8 * vol, now);
      oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(oscGain); oscGain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    }

    const MAP_TRANSFORMS = {

    const selectedMapNum = Math.floor(Math.random() * MAP_COUNT) + 1;

    let loadedMapObject = null;
    function collectMeshes(root) {

    // camera-only visual dip, same simplification most simpler FPS games make
    // rather than resizing colliders at runtime).
    const CAPSULE_RADIUS = 0.35;
    const CAPSULE_HALF_HEIGHT = 0.45; // half-length of the cylindrical middle section
    const CAPSULE_FEET_OFFSET = CAPSULE_HALF_HEIGHT + CAPSULE_RADIUS; // capsule center -> feet
    const MAX_STEP_HEIGHT = 0.4; // how tall a "step" the built-in autostep will climb

    let physicsReady = false;
    let physicsWorld = null;

    let characterBody = null;
    let characterCollider = null;
    let mapPhysicsBody = null; // one fixed body every map trimesh collider attaches to
    let physicsGrounded = false;

    function meshToTrimeshDesc(mesh) {
      mesh.updateMatrixWorld(true);
      const posAttr = mesh.geometry.attributes.position;
      const vertices = new Float32Array(posAttr.count * 3);
      const v = new THREE.Vector3();
      for (let i = 0; i < posAttr.count; i++) {
        v.fromBufferAttribute(posAttr, i);
        v.applyMatrix4(mesh.matrixWorld);
        vertices[i * 3] = v.x; vertices[i * 3 + 1] = v.y; vertices[i * 3 + 2] = v.z;
      }
      let indices;
      if (mesh.geometry.index) {
        indices = Uint32Array.from(mesh.geometry.index.array);
      } else {
        indices = new Uint32Array(posAttr.count);
        for (let i = 0; i < posAttr.count; i++) indices[i] = i;
      }
      return RAPIER.ColliderDesc.trimesh(vertices, indices);
    }

    function addMapCollidersToPhysics(meshes) {
      meshes.forEach(mesh => {
        try {
          physicsWorld.createCollider(meshToTrimeshDesc(mesh), mapPhysicsBody);
        } catch (e) {
          console.warn('Skipping a map mesh for physics (degenerate geometry):', mesh.name, e);
        }

      // through the world (e.g. off the map's edge), same role the invisible
      // `floor` mesh played before.
      const floorBody = physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed());

        RAPIER.ColliderDesc.cuboid(50, 0.1, 50).setTranslation(0, -0.1, 0), floorBody

      characterController.enableSnapToGround(0.3);
      characterController.setMaxSlopeClimbAngle(55 * Math.PI / 180);
      characterController.setMinSlopeSlideAngle(40 * Math.PI / 180);

      const bodyDesc = RAPIER.RigidBodyDesc.kinematicPositionBased()
        .setTranslation(0, CAPSULE_FEET_OFFSET, 0);
      characterBody = physicsWorld.createRigidBody(bodyDesc);
      characterCollider = physicsWorld.createCollider(
        RAPIER.ColliderDesc.capsule(CAPSULE_HALF_HEIGHT, CAPSULE_RADIUS), characterBody
      );

      physicsReady = true;
      if (pendingMapMeshesForPhysics) {
        addMapCollidersToPhysics(pendingMapMeshesForPhysics);
        pendingMapMeshesForPhysics = null;

    initPhysics();

    // Map tuning tool -- also drives the debug-mode (press 9) keyboard controls

    window.mapTune = {

      ring.style.transition = `stroke-dashoffset ${PULLOUT_DELAY_MS}ms linear`;
      ring.style.strokeDashoffset = '0';
      setTimeout(() => { ringWrap.style.opacity = '0'; }, PULLOUT_DELAY_MS);

      updateAmmoDisplay();
      playSwapSound(w.isMelee);
    }

    // Applies the current weapon's pos/rot/scale correction to whatever
    // model is currently sitting in gunGroup. Sketchfab downloads each come
    // in with their own arbitrary export scale/orientation, so every weapon
    // needs its own correction -- see modelTransform on each weapon entry.
    function applyModelTransform() {
      const w = weapons[currentWeaponIdx];
      const model = gunGroup.children[0];
      if (!model || !w.modelTransform) return;
      const t = w.modelTransform;
      model.position.set(...t.pos);
      model.rotation.set(...t.rot);
      model.scale.set(t.scale, t.scale, t.scale);
    }

    // --- Live calibration tool ---
    // Open DevTools console (F12) while playing and use these to nudge the
    // CURRENTLY EQUIPPED weapon's model until it looks right, then copy the
    // final numbers gunTune.show() prints into that weapon's modelTransform
    // above (in the weapons array) so it's baked in permanently.
    //
    // Examples:
    //   gunTune.rot(0, 0.1, 0)   -> rotate +0.1 rad around Y
    //   gunTune.rot(0, -0.1, 0)  -> rotate -0.1 rad around Y
    //   gunTune.scale(1.1)       -> grow 10%
    //   gunTune.scale(0.9)       -> shrink 10%
    //   gunTune.pos(0, 0.05, 0)  -> nudge up
    //   gunTune.show()           -> print current values to paste back into code
    window.gunTune = {
      rot(x = 0, y = 0, z = 0) {
        const t = weapons[currentWeaponIdx].modelTransform;
        t.rot[0] += x; t.rot[1] += y; t.rot[2] += z;
        applyModelTransform();
        this.show();
      },
      pos(x = 0, y = 0, z = 0) {
        const t = weapons[currentWeaponIdx].modelTransform;
        t.pos[0] += x; t.pos[1] += y; t.pos[2] += z;
        applyModelTransform();
        this.show();
      },
      scale(mult) {
        const t = weapons[currentWeaponIdx].modelTransform;
        t.scale *= mult;
        applyModelTransform();
        this.show();
      },
      show() {
        const w = weapons[currentWeaponIdx];
        console.log(`${w.name} modelTransform:`, JSON.stringify(w.modelTransform));
      }
    };

    function updateAmmoDisplay() {
      const w = weapons[currentWeaponIdx];
      document.getElementById('ammo-current').textContent = isReloading ? "--" : w.ammo;
      document.getElementById('ammo-max').textContent = w.maxAmmo;
      const reserveEl = document.getElementById('mag-reserve-count');
      if (w.reserveMags !== undefined) reserveEl.textContent = settings.adminMode ? '∞' : w.reserveMags;
    }

    // Target Dummy Architecture -- every enemy has 100 health + 100 shield.
    // Shield absorbs damage first; once depleted, damage carries through to health.
    const targetGroup = new THREE.Group();
    let targetHP = 100;
    let targetShield = 100;
    let hpHideTimeout = null;

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
    const headMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.6), bodyMat); torso.position.y = 1.6; torso.name = "torso";
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat); head.position.y = 2.8; head.name = "head";
    targetGroup.add(torso, head);
    targetGroup.position.set(0, 0, -15);
    scene.add(targetGroup);

    function updateTargetHPBar() {
      const hpContainer = document.getElementById('target-hp-container');
      if (hpContainer.style.opacity === '0') return;

      const pos = targetGroup.position.clone();
      pos.y += 3.4;
      pos.project(camera);

      const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

      hpContainer.style.left = `${x}px`;
      hpContainer.style.top = `${y}px`;
    }

    function updateTargetBars() {
      document.getElementById('target-shield-fill').style.width = `${Math.max(0, targetShield)}%`;
      document.getElementById('target-hp-fill').style.width = `${Math.max(0, targetHP)}%`;
    }

    function triggerDamageHPBar() {
      const hpContainer = document.getElementById('target-hp-container');
      updateTargetBars();
      hpContainer.style.opacity = '1';

      if (hpHideTimeout) clearTimeout(hpHideTimeout);
      hpHideTimeout = setTimeout(() => { hpContainer.style.opacity = '0'; }, 2500);
    }

    // Inputs & Keybindings
    const keys = {};
    document.addEventListener('keydown', (e) => {
      if (rebindingAction) return;
      keys[e.code] = true;

      if (e.code === 'AltLeft' || e.code === 'AltRight') e.preventDefault();
      if (!isLocked) return;

      if (e.code === keybinds.sprint) isSprinting = settings.toggleSprint ? !isSprinting : true;
      if (e.code === keybinds.crouch) isCrouching = settings.toggleCrouch ? !isCrouching : true;

      if (e.code === keybinds.reload) reload();
      if (e.code === keybinds.nextWeapon) switchNextWeapon();
      if (e.code === keybinds.weapon1) switchWeapon(0);
      if (e.code === keybinds.weapon2) switchWeapon(1);
      if (e.code === keybinds.weapon3) switchWeapon(2);
      if (e.code === keybinds.weapon4) switchWeapon(3);

      // Debug mode: press 9 to toggle calibration overlay + keyboard tuning.
      // Press M to switch what the tuning keys control: current weapon model,
      // or the loaded map (rotation/position/scale). Rotation: arrow keys +
      // comma/period. Scale: minus/equals. Position: bracket keys (X), Home/End
      // (Y), PageUp/PageDown (Z) -- all otherwise-unused keys so nothing
      // collides with WASD movement.
      if (e.code === 'Digit9') {
        debugMode = !debugMode;
        document.getElementById('debug-overlay').style.display = debugMode ? 'block' : 'none';
      }
      if (debugMode && e.code === 'KeyM') {
        debugTuneTarget = debugTuneTarget === 'weapon' ? 'map' : 'weapon';
      }
      if (debugMode && debugTuneTarget === 'weapon' && weapons[currentWeaponIdx].modelTransform) {
        const step = e.shiftKey ? 0.02 : 0.005;
        const scaleStep = e.shiftKey ? 1.05 : 1.01;
        const posStep = e.shiftKey ? 0.02 : 0.005;
        if (e.code === 'ArrowLeft') gunTune.rot(0, -step * 4, 0);
        if (e.code === 'ArrowRight') gunTune.rot(0, step * 4, 0);
        if (e.code === 'ArrowUp') gunTune.rot(step * 4, 0, 0);
        if (e.code === 'ArrowDown') gunTune.rot(-step * 4, 0, 0);
        if (e.code === 'Comma') gunTune.rot(0, 0, -step * 4);
        if (e.code === 'Period') gunTune.rot(0, 0, step * 4);
        if (e.code === 'Minus') gunTune.scale(1 / scaleStep);
        if (e.code === 'Equal') gunTune.scale(scaleStep);
        if (e.code === 'BracketLeft') gunTune.pos(-posStep, 0, 0);
        if (e.code === 'BracketRight') gunTune.pos(posStep, 0, 0);
        if (e.code === 'Home') gunTune.pos(0, posStep, 0);
        if (e.code === 'End') gunTune.pos(0, -posStep, 0);
        if (e.code === 'PageUp') gunTune.pos(0, 0, -posStep);
        if (e.code === 'PageDown') gunTune.pos(0, 0, posStep);
      } else if (debugMode && debugTuneTarget === 'map' && loadedMapObject) {
        const rotStep = e.shiftKey ? 15 : 5; // degrees -- map fixes are usually big 90deg corrections
        const scaleMult = e.shiftKey ? 1.08 : 1.02;
        const posStep = e.shiftKey ? 1.0 : 0.2;
        if (e.code === 'ArrowLeft') mapTune.rotDeg(0, -rotStep, 0);
        if (e.code === 'ArrowRight') mapTune.rotDeg(0, rotStep, 0);
        if (e.code === 'ArrowUp') mapTune.rotDeg(rotStep, 0, 0);
        if (e.code === 'ArrowDown') mapTune.rotDeg(-rotStep, 0, 0);
        if (e.code === 'Comma') mapTune.rotDeg(0, 0, -rotStep);
        if (e.code === 'Period') mapTune.rotDeg(0, 0, rotStep);
        if (e.code === 'Minus') mapTune.scale(1 / scaleMult);
        if (e.code === 'Equal') mapTune.scale(scaleMult);
        if (e.code === 'BracketLeft') mapTune.pos(-posStep, 0, 0);
        if (e.code === 'BracketRight') mapTune.pos(posStep, 0, 0);
        if (e.code === 'Home') mapTune.pos(0, posStep, 0);
        if (e.code === 'End') mapTune.pos(0, -posStep, 0);
        if (e.code === 'PageUp') mapTune.pos(0, 0, -posStep);
        if (e.code === 'PageDown') mapTune.pos(0, 0, posStep);
      }
    });

    document.addEventListener('keyup', (e) => { 
      keys[e.code] = false; 
      if (!isLocked) return;
      if (e.code === keybinds.sprint && !settings.toggleSprint) isSprinting = false;
      if (e.code === keybinds.crouch && !settings.toggleCrouch) isCrouching = false;
    });

    document.addEventListener('mousedown', (e) => {
      if (!isLocked) return;
      if (e.button === 2) startAiming();
      if (e.button === 0) isMouseDown = true;
    });

    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) isMouseDown = false;
      if (e.button === 2) stopAiming();
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    function startAiming() {
      const w = weapons[currentWeaponIdx];
      if (w.isMelee) return;
      isAiming = true;
      if (w.isSniper) {
        document.getElementById('sniper-overlay').style.display = 'block';
        gunGroup.visible = false;
        document.getElementById('crosshair').style.display = 'none';
      }
    }

    function stopAiming() {
      isAiming = false;
      document.getElementById('sniper-overlay').style.display = 'none';
      gunGroup.visible = true;
      document.getElementById('crosshair').style.display = 'block';
    }

    function switchNextWeapon() {
      const nextIdx = (currentWeaponIdx + 1) % weapons.length;
      switchWeapon(nextIdx, 'forward');
    }

    function switchWeapon(idx, explicitDir) {
      if (isReloading || idx === currentWeaponIdx) return;
      let dir = explicitDir;
      if (!dir) {
        dir = (idx > currentWeaponIdx) ? 'forward' : 'backward';
      }
      if (isAiming) stopAiming();
      currentWeaponIdx = idx;
      updateGunMesh(dir);
    }

    function reload() {
      const w = weapons[currentWeaponIdx];
      if (w.isMelee || isReloading || w.ammo === w.maxAmmo) return;
      if (!settings.adminMode && w.reserveMags !== undefined && w.reserveMags <= 0) return; // no spare mags left
      isReloading = true;
      updateAmmoDisplay();
      setTimeout(() => {
        if (!settings.adminMode && w.reserveMags !== undefined) w.reserveMags--; // Admin Mode: infinite mags, never consumed
        w.ammo = w.maxAmmo;
        isReloading = false;
        updateAmmoDisplay();
      }, 1200);
    }

    let hitmarkerTimeout = null;
    function triggerHitmarker(isHeadshot) {
      const hm = document.getElementById('hitmarker');
      hm.className = '';
      void hm.offsetWidth;
      hm.className = isHeadshot ? 'headshot' : 'hit';

      if (hitmarkerTimeout) clearTimeout(hitmarkerTimeout);
      hitmarkerTimeout = setTimeout(() => { hm.className = ''; }, 150);
    }

    // Weapon Attack & Shotgun Falloff Logic
    const raycaster = new THREE.Raycaster();
    function shoot() {
      const now = performance.now();
      const w = weapons[currentWeaponIdx];
      if (isReloading || now - lastShotTime < w.attackSpeed) return;
      if (now < weaponReadyTime) return; // still mid pullout-delay after a weapon swap
      if (isActivelySprinting) return; // can't fire while sprinting

      if (!w.isMelee && w.ammo <= 0) { reload(); return; }

      if (!w.isMelee) {
        w.ammo--;
        updateAmmoDisplay();
      }

      lastShotTime = now;
      playGunshotSound(w.type);

      gunRecoilPos = w.isMelee ? 0.15 : 0.25;
      gunRecoilRot = w.isMelee ? -0.3 : 0.18;

      let bloomMult = 1.0;
      let recoilMult = 1.0;

      if (isAiming) {
        bloomMult = w.isSniper ? 0.01 : 0.3;
        recoilMult = w.isSniper ? 0.05 : 0.35;
      }

      // Recoil kicks a separate visual offset (not the player's actual aim), which
      // auto-recenters in the main loop. Capped per-weapon at maxRecoil.
      recoilPitchOffset = Math.min(w.maxRecoil, recoilPitchOffset + w.recoilKick * recoilMult);

      w.currentSpread = Math.min(w.maxSpread, w.currentSpread + w.spreadIncrement * bloomMult);

      // Bullet drop: tilt the shot's local vertical aim down by the angle the
      // bullet would have fallen (0.5*g*t^2) over the distance to wherever the
      // target currently is, given this weapon's bulletSpeed. Distance-based
      // rather than raycast-based so it doesn't matter what you're pointed at --
      // aiming above the target to compensate curves the shot back down onto it.
      // Scales with distance, so it's negligible at close range and only bites
      // at longer range (melee has no bulletSpeed and skips this entirely).
      let dropOffset = 0;
      if (w.bulletSpeed) {
        const distToTarget = camera.position.distanceTo(targetGroup.position);
        const travelTime = distToTarget / w.bulletSpeed;
        const drop = 0.5 * BULLET_GRAVITY * travelTime * travelTime;
        dropOffset = distToTarget > 0 ? drop / distToTarget : 0; // small-angle radians
      }

      let hitAny = false;
      let hitHead = false;

      for (let i = 0; i < w.pellets; i++) {
        const spreadFactor = w.currentSpread * bloomMult;
        const rayDir = new THREE.Vector3(
          (Math.random() - 0.5) * spreadFactor,
          (Math.random() - 0.5) * spreadFactor - dropOffset,
          -1
        ).unproject(camera).sub(camera.position).normalize();

        raycaster.set(camera.position, rayDir);

        if (w.isMelee && camera.position.distanceTo(targetGroup.position) > 3.5) continue;

        const hits = raycaster.intersectObjects(targetGroup.children);

        if (hits.length > 0) {
          const hitObj = hits[0].object;
          const hitDist = hits[0].distance;
          const isHeadshot = (hitObj.name === "head");

          let calculatedDamage = w.damage;

          if (w.type === 'shotgun') {
            const closeRangeThreshold = 12;
            const maxRangeThreshold = 35;
            if (hitDist > closeRangeThreshold) {
              const falloffFactor = Math.max(0.15, 1.0 - ((hitDist - closeRangeThreshold) / (maxRangeThreshold - closeRangeThreshold)));
              calculatedDamage *= falloffFactor;
            }
          }

          // Headshots do 150% damage.
          let finalDamage = isHeadshot ? (calculatedDamage * 1.5) : calculatedDamage;

          // Shield absorbs damage first; overflow carries through to health.
          if (targetShield > 0) {
            const absorbed = Math.min(targetShield, finalDamage);
            targetShield -= absorbed;
            finalDamage -= absorbed;
          }
          targetHP -= finalDamage;

          hitAny = true;
          if (isHeadshot) hitHead = true;

          bodyMat.color.setHex(0xffffff);
          setTimeout(() => bodyMat.color.setHex(0x00ffcc), 60);

          triggerDamageHPBar();

          if (targetHP <= 0) {
            targetHP = 100;
            targetShield = 100;
            targetGroup.position.x = (Math.random() - 0.5) * 30;
            targetGroup.position.z = -10 - Math.random() * 20;
          }
        }
      }

      if (hitAny) {
        playHitSound(hitHead);
        triggerHitmarker(hitHead);
      }
    }

    // Physics & Main Game Loop
    let velocityY = 0;
    let canJump = false;
    let prevTime = performance.now();
    camera.position.y = 1.7;

    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');
    const crosshairContainer = document.getElementById('crosshair-container');
    const debugOverlayEl = document.getElementById('debug-overlay');

    function drawMinimap() {
      const size = minimapCanvas.width;
      minimapCtx.clearRect(0, 0, size, size);
      minimapCtx.fillStyle = 'rgba(20,20,26,0.9)';
      minimapCtx.fillRect(0, 0, size, size);

      // World floor is 100x100 centered at origin -- map world (x,z) to canvas px
      const scale = size / 100;
      const toCanvas = (wx, wz) => [size / 2 + wx * scale, size / 2 + wz * scale];

      // Target dummy marker
      const [tx, ty] = toCanvas(targetGroup.position.x, targetGroup.position.z);
      minimapCtx.fillStyle = '#ff3355';
      minimapCtx.beginPath();
      minimapCtx.arc(tx, ty, 4, 0, Math.PI * 2);
      minimapCtx.fill();

      // Player marker + facing direction (forward = (-sin(yaw), -cos(yaw)) in world x,z)
      const [px, py] = toCanvas(camera.position.x, camera.position.z);
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
      minimapCtx.strokeStyle = '#4af';
      minimapCtx.fillStyle = '#4af';
      minimapCtx.beginPath();
      minimapCtx.arc(px, py, 4, 0, Math.PI * 2);
      minimapCtx.fill();
      minimapCtx.beginPath();
      minimapCtx.moveTo(px, py);
      minimapCtx.lineTo(px + fx * 12, py + fz * 12);
      minimapCtx.lineWidth = 2;
      minimapCtx.stroke();
    }

    function updateDebugOverlay() {
      const collisionInfo =
        `<div class="dbg-title" style="color:#4af">PHYSICS (Rapier)</div>` +
        `ready: ${physicsReady}\n` +
        `grounded: ${dbgGrounded}\n` +
        `capsule pos: [${dbgBodyPos.x.toFixed(2)}, ${dbgBodyPos.y.toFixed(2)}, ${dbgBodyPos.z.toFixed(2)}]\n` +
        `velocityY: ${dbgVelocityY.toFixed(3)}\n` +
        `corrected move: [${dbgCorrected.x.toFixed(3)}, ${dbgCorrected.y.toFixed(3)}, ${dbgCorrected.z.toFixed(3)}]\n\n`;

      if (debugTuneTarget === 'map') {
        if (!loadedMapObject) {
          debugOverlayEl.innerHTML = collisionInfo + `<div class="dbg-title">DEBUG MODE -- Map</div>Map not loaded.\n\nPress M to tune weapon instead.\nPress 9 to exit`;
          return;
        }
        const r = loadedMapObject.rotation, p = loadedMapObject.position, s = loadedMapObject.scale;
        debugOverlayEl.innerHTML =
          collisionInfo +
          `<div class="dbg-title">DEBUG MODE -- Map (map${selectedMapNum})</div>` +
          `pos:     [${[p.x, p.y, p.z].map(v => v.toFixed(3)).join(', ')}]\n` +
          `rot deg: [${[r.x, r.y, r.z].map(v => THREE.MathUtils.radToDeg(v).toFixed(1)).join(', ')}]\n` +
          `scale:   ${s.x.toFixed(4)}\n\n` +
          `Arrows: rotate Y/X (5deg)\n,  .  : rotate Z\n-  =  : scale\n[  ]  : pos X\nHome End: pos Y\nPgUp PgDn: pos Z\n(hold Shift for bigger steps)\nPress M to tune weapon\nPress 9 to exit`;
        return;
      }
      const w = weapons[currentWeaponIdx];
      if (!w.modelTransform) { debugOverlayEl.innerHTML = collisionInfo + `${w.name} has no model transform.`; return; }
      const t = w.modelTransform;
      debugOverlayEl.innerHTML =
        collisionInfo +
        `<div class="dbg-title">DEBUG MODE -- ${w.name}</div>` +
        `pos:   [${t.pos.map(v => v.toFixed(3)).join(', ')}]\n` +
        `rot:   [${t.rot.map(v => v.toFixed(3)).join(', ')}]\n` +
        `scale: ${t.scale.toFixed(4)}\n\n` +
        `Arrows: rotate Y/X\n,  .  : rotate Z\n-  =  : scale\n[  ]  : pos X\nHome End: pos Y\nPgUp PgDn: pos Z\n(hold Shift for bigger steps)\nPress M to tune map\nPress 9 to exit`;
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      // Can't fire while actively sprinting (moving + sprint engaged) -- shoot()
      // itself also guards this so a queued click can't sneak a shot in.
      if (isMouseDown && isLocked && !isActivelySprinting) {
        shoot();
      }

      const w = weapons[currentWeaponIdx];
      if (time - lastShotTime > w.attackSpeed) {
        w.currentSpread = Math.max(w.baseSpread, w.currentSpread - w.spreadRecovery * delta);
      }

      // Recoil auto-recenters over time. Full-auto fire on a high-RPM weapon
      // outpaces this recovery (each new kick lands before the last one settles),
      // but letting off the trigger lets it fully recover in under a second --
      // rewards controlled, semi-auto shooting over holding the trigger down.
      recoilPitchOffset = THREE.MathUtils.lerp(recoilPitchOffset, 0, RECOIL_RECOVERY_RATE);

      // Sustained-fire punishment: holding fire on ANY weapon ramps up shake
      // asymptotically toward SUSTAINED_SHAKE_MAX. Only counts as "actively
      // shooting" if the weapon can actually fire right now -- holding the
      // trigger while reloading or dry does NOT build shake. The instant you
      // stop (release, run dry, or start reloading), shake cuts to zero --
      // no lingering decay tail.
      const hasAmmoToFire = w.isMelee || (!isReloading && w.ammo > 0);
      const qualifiesForShake = isMouseDown && isLocked && hasAmmoToFire;
      if (qualifiesForShake) {
        sustainedFireTime += delta;
      } else {
        sustainedFireTime = 0;
      }
      const shakeIntensity = SUSTAINED_SHAKE_MAX * (1 - Math.exp(-sustainedFireTime / SUSTAINED_SHAKE_TAU));
      shakeOffsetX = (Math.random() - 0.5) * shakeIntensity;
      shakeOffsetY = (Math.random() - 0.5) * shakeIntensity;
      const crosshairPx = shakeIntensity * 500;
      crosshairContainer.style.transform =
        `translate(calc(-50% + ${(Math.random() - 0.5) * crosshairPx}px), calc(-50% + ${(Math.random() - 0.5) * crosshairPx}px))`;

      camera.rotation.set(0, 0, 0);
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw + shakeOffsetX;
      camera.rotation.x = pitch + recoilPitchOffset + cameraPitchOffset + shakeOffsetY;
      camera.rotation.z = cameraRoll;

      if (isLocked) {
        const moveVec = new THREE.Vector3();
        if (keys[keybinds.forward]) moveVec.z -= 1;
        if (keys[keybinds.backward]) moveVec.z += 1;
        if (keys[keybinds.left]) moveVec.x -= 1;
        if (keys[keybinds.right]) moveVec.x += 1;

        const isMoving = moveVec.lengthSq() > 0;
        moveVec.normalize();
        const localStrafeX = moveVec.x; // capture BEFORE world-space rotation, for camera lean
        moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        const weightMult = w.movementSpeed;
        let speed = 5.0 * weightMult;

        isActivelySprinting = isSprinting && isMoving && !isCrouching && !isExhausted && !isAiming;

        if (isAiming) {
          speed = 3.0 * weightMult;
          if (isCrouching) speed = 1.7 * weightMult;
        } else if (isCrouching) {
          speed = 1.7 * weightMult;
        } else if (isActivelySprinting) {
          speed = 8.0 * weightMult;
          stamina = Math.max(0, stamina - 28 * delta);
          if (stamina === 0) isExhausted = true;
        }

        if (!isActivelySprinting) {
          stamina = Math.min(maxStamina, stamina + 32 * delta);
          if (stamina >= maxStamina) isExhausted = false;
        }

        const staminaContainer = document.getElementById('stamina-container');
        document.getElementById('stamina-fill').style.width = `${(stamina / maxStamina) * 100}%`;
        staminaContainer.style.opacity = (stamina < maxStamina) ? '1' : '0';

        // Movement + gravity + collision, resolved by Rapier's built-in capsule
        // character controller (handles autostep, slopes, snap-to-ground, and
        // proper shape-vs-world contact -- replacing the old per-frame raycast
        // system, which was the source of the auto-teleport and fall-through
        // bugs since single rays are sensitive to geometry gaps/winding in a
        // way real shape collision isn't).
        const targetEyeHeight = isCrouching ? 0.9 : 1.7;
        currentEyeHeight += (targetEyeHeight - currentEyeHeight) * 0.2;

        if (physicsReady) {
          if (keys[keybinds.jump] && canJump) {
            velocityY = 8.75;
            canJump = false;
          }
          velocityY -= 30.0 * delta;

          const desiredMovement = {
            x: moveVec.x * speed * delta, y: velocityY * delta, z: moveVec.z * speed * delta
          };
          characterController.computeColliderMovement(characterCollider, desiredMovement);
          const corrected = characterController.computedMovement();
          physicsGrounded = characterController.computedGrounded();

          const pos = characterBody.translation();
          characterBody.setNextKinematicTranslation({
            x: pos.x + corrected.x, y: pos.y + corrected.y, z: pos.z + corrected.z
          });
          physicsWorld.step();

          if (physicsGrounded) { velocityY = 0; canJump = true; }

          const bodyPos = characterBody.translation();
          camera.position.set(bodyPos.x, bodyPos.y - CAPSULE_FEET_OFFSET + currentEyeHeight, bodyPos.z);
          dbgGrounded = physicsGrounded; dbgBodyPos = bodyPos; dbgVelocityY = velocityY; dbgCorrected = corrected;

          // Safety net: if physics ever fails to catch a fall (a geometry gap,
          // etc.), don't let the player fall into the void forever -- reset
          // back to spawn instead.
          if (bodyPos.y < -30) {
            characterBody.setNextKinematicTranslation({ x: 0, y: CAPSULE_FEET_OFFSET, z: 0 });
            velocityY = 0;
          }
        }

        // Camera inertia: lean into strafe direction, dip slightly on fall/jump.
        // Both lag behind the actual motion (slow lerp) rather than snapping,
        // which is the "delay slightly" feel from the notes.
        //
        // R6 Siege-style lean (Q/E) takes priority over the passive strafe lean
        // when actively held -- it's a deliberate, stronger tilt + a small
        // sideways peek offset. NOTE: lean direction is my best guess without
        // being able to see the render -- if Q/E feel swapped, flip the signs
        // on leanInput below.
        let leanInput = 0;
        if (keys['KeyQ']) leanInput -= 1;
        if (keys['KeyE']) leanInput += 1;
        const prevLeanOffset = leanOffset;
        leanOffset = THREE.MathUtils.lerp(leanOffset, leanInput, 0.15);
        const leanDelta = leanOffset - prevLeanOffset;
        const rightX = Math.cos(yaw), rightZ = -Math.sin(yaw);
        camera.position.x += rightX * leanDelta * 0.5;
        camera.position.z += rightZ * leanDelta * 0.5;

        const rollTarget = leanInput !== 0 ? -leanOffset * 0.3 : -localStrafeX * 0.05;
        cameraRoll = THREE.MathUtils.lerp(cameraRoll, rollTarget, leanInput !== 0 ? 0.15 : 0.06);
        const pitchDipTarget = THREE.MathUtils.clamp(-velocityY * 0.0035, -0.05, 0.05);
        cameraPitchOffset = THREE.MathUtils.lerp(cameraPitchOffset, pitchDipTarget, 0.05);

        gunRecoilPos = THREE.MathUtils.lerp(gunRecoilPos, 0, 0.15);
        gunRecoilRot = THREE.MathUtils.lerp(gunRecoilRot, 0, 0.15);

        swapOffset = THREE.MathUtils.lerp(swapOffset, 0, 0.18);

        if (isMoving && !isAiming) {
          weaponBobTime += delta * speed * 2.5;
        } else {
          weaponBobTime = THREE.MathUtils.lerp(weaponBobTime, 0, 0.1);
        }

        const bobX = Math.cos(weaponBobTime) * 0.015;
        const bobY = Math.sin(weaponBobTime * 2) * 0.015;

        // Sprint pose: weapon tucks in sideways across the body, like carrying
        // it two-handed at a run, instead of the normal hip-fire position.
        const baseGunPos = isAiming
          ? new THREE.Vector3(0, -0.18, -0.4)
          : (isActivelySprinting ? SPRINT_GUN_POS : new THREE.Vector3(0.3, -0.25, -0.5));
        gunGroup.position.x = THREE.MathUtils.lerp(gunGroup.position.x, baseGunPos.x + bobX, 0.2);
        gunGroup.position.y = THREE.MathUtils.lerp(gunGroup.position.y, baseGunPos.y + bobY + swapOffset, 0.2);
        gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, baseGunPos.z + gunRecoilPos, 0.2);
        gunGroup.rotation.x = gunRecoilRot + (swapOffset * 0.5);
        gunGroup.rotation.y = THREE.MathUtils.lerp(gunGroup.rotation.y, isActivelySprinting ? SPRINT_GUN_ROT_Y : 0, 0.15);
        gunGroup.rotation.z = THREE.MathUtils.lerp(gunGroup.rotation.z, isActivelySprinting ? SPRINT_GUN_ROT_Z : 0, 0.15);
      } else {
        cameraRoll = THREE.MathUtils.lerp(cameraRoll, 0, 0.06);
        cameraPitchOffset = THREE.MathUtils.lerp(cameraPitchOffset, 0, 0.05);
        leanOffset = THREE.MathUtils.lerp(leanOffset, 0, 0.15);
        isActivelySprinting = false;
      }

      // FOV: slight smooth boost while actively sprinting; zoom takes priority
      // while aiming (can't sprint and aim at once anyway, but be explicit).
      const sprintFovBoost = isActivelySprinting ? settings.fov * SPRINT_FOV_BOOST_PCT : 0;
      const targetFOV = isAiming ? w.zoomFov : (settings.fov + sprintFovBoost);
      camera.fov += (targetFOV - camera.fov) * 0.15;
      camera.updateProjectionMatrix();

      updateTargetHPBar();
      drawMinimap();
      if (debugMode) updateDebugOverlay();

      prevTime = time;
      renderer.render(scene, camera);
    }

    // UI & Settings Functions
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function toggleSetting(settingKey) {
      settings[settingKey] = !settings[settingKey];
      const btnIds = { toggleSprint: 'toggle-sprint-btn', toggleCrouch: 'toggle-crouch-btn', adminMode: 'toggle-admin-btn' };
      const btn = document.getElementById(btnIds[settingKey]);
      if (settings[settingKey]) {
        btn.textContent = 'Enabled'; btn.classList.add('active');
      } else {
        btn.textContent = 'Disabled'; btn.classList.remove('active');
      }
      if (settingKey === 'adminMode') updateAmmoDisplay();
    }

    document.getElementById('sens').addEventListener('input', (e) => {
      settings.sensitivity = parseFloat(e.target.value);
      document.getElementById('sens-val').textContent = settings.sensitivity.toFixed(1);
    });
    document.getElementById('scope-sens').addEventListener('input', (e) => {
      settings.scopeSensMult = parseFloat(e.target.value);
      document.getElementById('scope-sens-val').textContent = settings.scopeSensMult.toFixed(1);
    });
    document.getElementById('fov').addEventListener('input', (e) => {
      settings.fov = parseInt(e.target.value);
      document.getElementById('fov-val').textContent = settings.fov;
    });

    document.getElementById('master-vol').addEventListener('input', (e) => {
      audioSettings.master = parseInt(e.target.value);
      document.getElementById('master-val').textContent = audioSettings.master + '%';
    });

    function resetSettings() {
      Object.assign(settings, DEFAULTS.settings);
      document.getElementById('sens').value = settings.sensitivity;
      document.getElementById('sens-val').textContent = settings.sensitivity.toFixed(1);
      document.getElementById('scope-sens').value = settings.scopeSensMult;
      document.getElementById('scope-sens-val').textContent = settings.scopeSensMult.toFixed(1);
      document.getElementById('fov').value = settings.fov;
      document.getElementById('fov-val').textContent = settings.fov;

      const sprBtn = document.getElementById('toggle-sprint-btn');
      sprBtn.textContent = 'Disabled'; sprBtn.classList.remove('active');
      const crBtn = document.getElementById('toggle-crouch-btn');
      crBtn.textContent = 'Disabled'; crBtn.classList.remove('active');
      const adminBtn = document.getElementById('toggle-admin-btn');
      adminBtn.textContent = 'Disabled'; adminBtn.classList.remove('active');
      updateAmmoDisplay();
    }

    function resetControls() {
      Object.assign(keybinds, DEFAULTS.keybinds);
      document.querySelectorAll('.keybind-btn').forEach(btn => {
        const action = btn.getAttribute('data-action');
        if (action && keybinds[action]) btn.textContent = keybinds[action];
      });
    }

    function resetAudio() {
      Object.assign(audioSettings, DEFAULTS.audio);
      document.getElementById('master-vol').value = audioSettings.master;
      document.getElementById('master-val').textContent = audioSettings.master + '%';
    }

    let rebindingAction = null;
    let rebindingBtn = null;

    function rebind(action, btn) {
      if (rebindingAction) return;
      rebindingAction = action; rebindingBtn = btn;
      btn.textContent = "PRESS ANY KEY..."; btn.classList.add('listening');

      const captureKey = (e) => {
        e.preventDefault();
        keybinds[rebindingAction] = e.code;
        rebindingBtn.textContent = e.code;
        rebindingBtn.classList.remove('listening');
        rebindingAction = null; rebindingBtn = null;
        window.removeEventListener('keydown', captureKey);
      };
      window.addEventListener('keydown', captureKey);
    }

    updateGunMesh();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
