<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wave Survival Game</title>
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            background: #222;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            pointer-events: none;
        }
        /* Giant Wave Cleared Title Card */
        #wave-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 64px;
            font-weight: bold;
            color: #ffe600;
            text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000;
            pointer-events: none;
            transition: transform 0.2s ease-out, opacity 0.5s ease-in;
            opacity: 0;
            text-align: center;
            white-space: nowrap;
            z-index: 10;
        }
        #wave-banner.show {
            transform: translate(-50%, -50%) scale(1.2);
            opacity: 1;
        }
        #wave-banner.hide {
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            transition: transform 0.5s ease-in, opacity 0.5s ease-in;
        }
    </style>
</head>
<body>

    <div id="ui">
        Wave: <span id="wave-num">1</span> | 
        Zombies Left: <span id="zombie-count">0</span> | 
        Health: <span id="player-hp">100</span> | 
        Ammo: <span id="player-ammo">30</span>
    </div>

    <div id="wave-banner">WAVE CLEARED!</div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let wave = 1;
let score = 0;
let player = { x: 400, y: 300, radius: 15, speed: 4, hp: 100, ammo: 30 };
let zombies = [];
let ammoDrops = [];
let bullets = [];
let keys = {};

let waveActive = false;
let bossSpawnTimer = 0;

// Input tracking
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    shootBullet(mouseX, mouseY);
});

function shootBullet(targetX, targetY) {
    if (player.ammo > 0) {
        player.ammo--;
        updateUI();
        const angle = Math.atan2(targetY - player.y, targetX - player.x);
        bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 10,
            vy: Math.sin(angle) * 10,
            radius: 4
        });
    }
}

// Start Wave Function with Scaling & Boss Check
function startNewWave() {
    waveActive = true;
    zombies = [];
    
    const isBossWave = (wave % 5 === 0);
    let zombieCount = 5 + (wave * 2);

    if (isBossWave) {
        // Spawn Boss
        zombies.push({
            x: Math.random() * canvas.width,
            y: 50,
            radius: 40,
            hp: 200 + (wave * 50),
            maxHp: 200 + (wave * 50),
            speed: 1.5,
            isBoss: true,
            minionTimer: 0
        });
        zombieCount = 3; // fewer normal minions when boss is out
    }

    // Spawn regular zombies with dynamic stats
    for (let i = 0; i < zombieCount; i++) {
        spawnZombie(false);
    }
    updateUI();
}

function spawnZombie(isMinion) {
    // Dynamic Zombie Scaling: Health & Speed increase per wave
    let baseHp = 30;
    let baseSpeed = 2;
    
    let scaledHp = baseHp * (1 + (wave - 1) * 0.15);
    let scaledSpeed = Math.min(3.5, baseSpeed + (wave * 0.05));

    zombies.push({
        x: Math.random() * canvas.width,
        y: Math.random() < 0.5 ? 0 : canvas.height,
        radius: isMinion ? 12 : 18,
        hp: isMinion ? 15 : scaledHp,
        speed: isMinion ? scaledSpeed * 1.2 : scaledSpeed,
        isBoss: false
    });
}

// Giant Wave Cleared Title Trigger
function triggerWaveClearedBanner() {
    const banner = document.getElementById('wave-banner');
    banner.innerText = `WAVE ${wave} CLEARED!`;
    banner.classList.add('show');
    
    setTimeout(() => {
        banner.classList.remove('show');
        banner.classList.add('hide');
        setTimeout(() => {
            banner.classList.remove('hide');
            wave++;
            startNewWave();
        }, 500);
    }, 2000);
}

function updateUI() {
    document.getElementById('wave-num').innerText = wave;
    document.getElementById('zombie-count').innerText = zombies.length;
    document.getElementById('player-hp').innerText = player.hp;
    document.getElementById('player-ammo').innerText = player.ammo;
}

// Main Game Loop
function update() {
    // Player Movement
    if (keys['w'] && player.y > 0) player.y -= player.speed;
    if (keys['s'] && player.y < canvas.height) player.y += player.speed;
    if (keys['a'] && player.x > 0) player.x -= player.speed;
    if (keys['d'] && player.x < canvas.width) player.x += player.speed;

    // Bullet Updates
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Wall bounds check
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        // Bullet-Zombie Collision
        for (let j = zombies.length - 1; j >= 0; j--) {
            let z = zombies[j];
            let dist = Math.hypot(b.x - z.x, b.y - z.y);
            if (dist < b.radius + z.radius) {
                z.hp -= 15;
                bullets.splice(i, 1);

                if (z.hp <= 0) {
                    // Drop Ammo box (Pixel Gun style look handled in draw)
                    ammoDrops.push({ x: z.x, y: z.y, size: 16 });
                    zombies.splice(j, 1);
                }
                break;
            }
        }
    }

    // Zombie Updates
    zombies.forEach(z => {
        // Move towards player
        let angle = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;

        // Boss Minion Spawner Mechanic (Every 10 seconds / 600 frames)
        if (z.isBoss) {
            z.minionTimer++;
            if (z.minionTimer >= 600) {
                z.minionTimer = 0;
                // Spawn 5 weak minions around the boss
                for (let m = 0; m < 5; m++) {
                    spawnZombie(true);
                }
            }
        }

        // Zombie-Player Collision
        let dist = Math.hypot(player.x - z.x, player.y - z.y);
        if (dist < player.radius + z.radius) {
            player.hp -= z.isBoss ? 2 : 0.5; // Boss hurts a lot more
            if (player.hp <= 0) {
                alert("Game Over! Refresh to restart.");
                player.hp = 100;
                wave = 1;
                startNewWave();
            }
        }
    });

    // Ammo Pickup Collision (Pixel Gun style boxes on floor)
    for (let i = ammoDrops.length - 1; i >= 0; i--) {
        let drop = ammoDrops[i];
        let dist = Math.hypot(player.x - drop.x, player.y - drop.y);
        if (dist < player.radius + drop.size) {
            player.ammo += 15;
            ammoDrops.splice(i, 1);
        }
    }

    // Check Wave Clear
    if (zombies.length === 0 && waveActive) {
        waveActive = false;
        triggerWaveClearedBanner();
    }

    updateUI();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Pixel-Art Style Floor Ammo Pickups
    ammoDrops.forEach(drop => {
        ctx.fillStyle = "#00ffcc"; // Neon cyan ammo box
        ctx.fillRect(drop.x - drop.size/2, drop.y - drop.size/2, drop.size, drop.size);
        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(drop.x - drop.size/2, drop.y - drop.size/2, drop.size, drop.size);
    });

    // Draw Player
    ctx.fillStyle = "#3498db";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();

    // Draw Bullets
    ctx.fillStyle = "#f1c40f";
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Zombies & Bosses
    zombies.forEach(z => {
        ctx.fillStyle = z.isBoss ? "#8e44ad" : "#e74c3c"; // Purple for Boss, Red for standard/minions
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
        ctx.fill();

        // Health bar for boss
        if (z.isBoss) {
            ctx.fillStyle = "#555";
            ctx.fillRect(z.x - 30, z.y - 55, 60, 8);
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(z.x - 30, z.y - 55, (z.hp / z.maxHp) * 60, 8);
        }
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Initialize First Wave
startNewWave();
loop();
</script>

</body>
</html>
